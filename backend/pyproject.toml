[project]
name = "pmt-backend"
version = "0.1.0"
description = "PMT（WBS・工数・進捗管理システム）のサーバ"
requires-python = ">=3.12"
# 依存の版は requirements.lock で固定する（設計書 1.1）。ここには直接の依存の名前だけを書く
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "alembic",
  "pydantic",
  "pydantic-settings",
  "openpyxl",
  "psycopg[binary]",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.pytest.ini_options]
# リポジトリの根から `.venv/bin/python -m pytest -q backend/tests` で流す。rootdir は backend/ になる
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
