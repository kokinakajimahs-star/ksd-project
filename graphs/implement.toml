write_set = ["backend/alembic", "backend/app/main.py", "backend/app/schemas", "backend/app/services", "backend/tests", "docs/decisions/ASSUMPTIONS.md", "docs/instruction-change-requests.md", "docs/open-questions.md", "frontend/src"]
max_iterations = 6
on_fail = "continue"        # 収束しないスコープがあっても他を止めない

# --- 独立レビュー（fresh context。実装者の仮定を引き継がない）
#
# **実機で出た欠陥を反映してある**（run_20260815T143202_5de048）:
#   max_turns の既定 12 では effort=high のレビューが切れる
#   Bash は git にしか開かない。Read / Grep / Glob を使わせる
#
# **実装ループを `needs_optional` で待つ**（CR-I-039。2026-10-21 までは `needs`）。`needs` だと
# 1 つのスコープが収束しない（FAILED）だけで kloop がレビューを SKIPPED にした——
# 実装ループの `on_fail = "continue"`（他を止めない）がレビューには効いていなかった。
# 任意依存はループが終われば（SUCCEEDED・FAILED・SKIPPED）走り、収束しなかったスコープは
# 「完了しなかった上流ノード」として事実がレビューのプロンプトに渡る（kloop CR-033）。
# 収束しないスコープがある run は、レビューが済んでも BLOCKED_NO_PROGRESS で終わる。
# verify-before が止まった（検証器を起こせない）なら run はそこで止まり、レビューは走らない。
# **kloop 1.19.0 以上が要る。**それ未満は `needs_optional` を読まずに黙って捨てるので、
# レビューが依存なしで最初に走る（ノードの未知のキーを拒まない。kloop graph.py）。
[[nodes]]
id = "review"
kind = "agent"
needs_optional = ["impl-api-chg", "impl-api-cmn", "impl-api-eff", "impl-api-est", "impl-api-int", "impl-api-prg", "impl-api-prj", "impl-api-rpt", "impl-api-sch", "impl-api-wbs", "impl-db-chg", "impl-db-cmn", "impl-db-eff", "impl-db-est", "impl-db-prg", "impl-db-prj", "impl-db-sch", "impl-db-wbs", "impl-rule-auth", "impl-rule-cal", "impl-rule-chg", "impl-rule-eff", "impl-rule-est", "impl-rule-int", "impl-rule-prg", "impl-rule-rpt", "impl-rule-sch", "impl-rule-wbs", "impl-ui-chg", "impl-ui-cmn", "impl-ui-eff", "impl-ui-int", "impl-ui-prg", "impl-ui-prj", "impl-ui-rpt", "impl-ui-sch", "impl-ui-wbs"]
prompt_file = "prompts/review-diff.md"
outputs = ["findings.md"]
allowed_tools = ["Read", "Glob", "Grep", "Write", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git status:*)"]
effects = ["reads-tree"]
effort = "high"
max_turns = 40

# コミットの前の承認ゲート（gate-commit）は置かない（ksd-ls の Q-LS-34・kloop の CR-073・CR-I-034）。
# 人の承認のゲートはクラウドの資源の構成変更にだけ置く。findings.md は review の成果物に残る
