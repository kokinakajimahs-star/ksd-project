id = "impl-api-chg"
kind = "loop"
needs = ["verify-before", "impl-api-sch", "impl-db-chg", "impl-rule-chg"]
task = "implement-api-chg"
write_set = ["backend/alembic", "backend/app/api", "backend/app/main.py", "backend/app/schemas", "backend/app/services", "backend/tests", "docs/decisions/ASSUMPTIONS.md", "docs/instruction-change-requests.md", "docs/open-questions.md"]
