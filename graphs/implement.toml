# `on_fail = "continue"` を足しても解決しない——kloop の `needs` は
# 依存が **SUCCEEDED** であることを要求し、FAILED なら後続を
# 「上流ノードが失敗またはスキップされた」として SKIPPED にする
# （kloop graph.py の _scan_ready）。完了だけを待つ `needs_optional`（kloop 1.19.0 から）で
# 実装ループを走らせても、途中のノードが FAILED なら run は BLOCKED_NO_PROGRESS で
# 終わる——**実装ループがすべて収束しても run は成功にならない**（CR-I-037 と同じ判断）。
#
# 実測: run_20260816T040816_aef3df は verify-before が
# 「検証器が FAIL（失敗 32 件）」で BLOCKED_NO_PROGRESS。完了ノード 0 件。
#
# したがって command ノードにし、**検証器の FAIL（exit 1）を 0 にする**。
# 0・1 の他（kloop が無い 7 など）は基準を取れていないので、返して止める（CR-I-039）。
# 基準は .kloop/runs/<run>/nodes/verify-before/ に残る（command.log の baseline= の行と、
# kloop の検証器なら verify-result.json。ラッパが KLOOP_RESULT_PATH をそこへ向ける。CR-I-040）。
#
# **FAIL を 0 にするのは `bash -c "... || true"` ではなくスクリプトの中で行う**
# （指示書 §7.4 / CR-I-009）。kloop.toml へ [graph.command_policy] を
# 宣言すると、`-c` を含む argv は**グラフの読み込みで拒否される**
# （kloop 指示書 §6.2 / kloop CR-014。ENVIRONMENT_ERROR / 終了コード 7。
# on_fail は効かず、run は 1 ノードも実行しない）。
# ラッパは ksd-x が供給する（無ければ `ksdx plan graph` が書き出す）。
#
# このグラフを [graph.command_policy] の下で動かすには、kloop.toml へ:
#
#   [graph.command_policy]
#   allow = [["bash", "scripts/verify-baseline.sh"]]
#
# **許可することは、そのスクリプトの中身を信頼すると決めることである。**
# kloop も ksd-x も中身は見ない。
#
# **kloop は 1.3.0 以上が要る。**1.2.0 には command_policy の読み取り側が
# 無く、宣言しても**黙って無視される**（require_kloop_version も上げること）。
[[nodes]]
id = "verify-before"
kind = "command"
command = ["bash", "scripts/verify-baseline.sh", "all"]

